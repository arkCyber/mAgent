[package]
name = "magent-esp32-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "mAgent firmware for the ESP32-C61-DevKitC-1-N8R2 (N8R2, std)"

# TRACE: REQ-FW-001 — this crate only compiles with the ESP-IDF toolchain.
# Building on a host OS requires `esp-idf-svc`'s build.rs to run (delegates to
# `embuild::build()`), which downloads ESP-IDF v6.0 if not present.

[dependencies]
# Chip-agnostic core — the `esp32` feature activates RISC-V HAL deps.
# The `std` feature is needed because esp-idf-svc provides std:: threads.
# `wallet` enables digital wallet with BIP-39, keystore, and wallet management.
magent-core = { path = "../../magent-core", default-features = false, features = ["esp32", "link_adapters", "ingress", "web3", "boot-key", "wallet"] }
# Lua application host (host/lua-app). Optional: only pulled in on the
# ESP32-S3 (`board-s3,lua` features) so the RAM-limited C61 default build never
# compiles the Lua VM. Built with `default-features = false, features =
# ["piccolo"]` so NO `mlua` (vendored C) is compiled — `mlua` cannot build for
# Xtensa; `piccolo` is pure Rust.
magent-lua = { path = "../../host/lua-app", default-features = false, features = ["piccolo"], optional = true }
# ---------------------------------------------------------------------------
# ESP-IDF integration (the std story for the C61-N8R2).
# ---------------------------------------------------------------------------
# esp-idf-svc wraps the ESP-IDF C stack with idiomatic Rust. It provides:
#   - esp_idf_svc::wifi (Wi-Fi STA / AP)
#   - esp_idf_svc::nvs (non-volatile storage)
#   - esp_idf_svc::http::client (HTTP/RPC calls to LLM backend)
#   - esp_idf_svc::sysloop (the event loop that drives the above)
#   - esp_idf_svc::log (global logger via esp-idf's logging subsystem)
#
# The `experimental` feature exposes async wrappers (EspTimer, etc.)
# that are useful for the ReAct loop. TRACE: REQ-FW-001, REQ-NET-001.
esp-idf-svc = { workspace = true, features = ["experimental", "std"] }
# PATCHED (MicroAgent): Use native driver with PlatformIO ESP-IDF.
esp-idf-sys = { workspace = true, default-features = false, features = ["pio"] }
# Trait surface for the esp-idf-svc HTTP client (used by `AT+HTTPGET=<url>`
# and the DeepSeek LLM backend). Aligned with esp-idf-svc's transitive
# `embedded-svc 0.29`.
embedded-svc = "0.29"
# JSON for the DeepSeek chat-completions request/response parsing (the LLM
# backend installed into the agent).
serde_json = { workspace = true }
# URL-safe base64 decode for `AT+LUAAPP=<base64>` (operator Lua-app update).
base64 = "0.22"

# esp-idf-svc requires std. `std` is implied by the espidf feature above
# but we set it explicitly so the dependency graph is self-documenting.
#
# NOTE: we deliberately drop all `esp-hal` / `embassy-*` deps from the
# old bare-metal path. The embassy executor is incompatible with
# esp-idf-svc's thread model and would cause double-scheduling.
# Once this std path is verified on real hardware, the old
# `esp-hal + embassy` path can be archived. TRACE: REQ-FW-001.

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# esp-idf-svc::log re-exports the esp-idf logging C code through Rust.
# `esp_idf_svc::log::EspLogger` implements `log::Log` and installs as the
# global logger in `main()`. The log level is controlled by `sdkconfig.defaults`.
log = { workspace = true }

# Hex encoding for diagnostic logging (used by link_adapters fallback).
hex = "0.4"

# Random number generation backed by the ESP32 HW RNG via esp-idf's
# `getrandom` shim. Required by `LinkAdapter::provision_random_seed`.
getrandom = { version = "0.2", features = ["custom"] }

# esp_println is a tiny no-deps `println!` macro that routes to
# esp-idf's `esp_log_write`. We use it in the panic handler so we can
# print diagnostics even when the global logger hasn't been installed
# yet (e.g. if std::rt init fails). The chip feature is selected by the
# compile-time board switch (`board-c61` → `esp32c6`, `board-s3` →
# `esp32s3`) so the same source builds for either chip.
esp-println = { version = "0.13" }

# ---------------------------------------------------------------------------
# Communication adapters — UART + button via embedded-io traits.
# These are `no_std`-clean so they work in the esp-idf-svc std context.
# ---------------------------------------------------------------------------
embedded-hal = { workspace = true }
embedded-io = { workspace = true }
# PATCHED (MicroAgent): direct heapless dep so we can refer to
# `heapless::String<N>` in `link_adapters::source_kind` for the
# `IngressSource` bridge (magent-core's heapless 0.9 type).
heapless = { workspace = true }
serde = { workspace = true }
serde-json-core = "0.6.0"

# ---------------------------------------------------------------------------
# Std library utilities needed by the esp-idf-svc integration.
# ---------------------------------------------------------------------------
critical-section = "1.1"
once_cell = "1"

# `futures::executor::block_on` drives the `MiniAgent::run` future
# synchronously on a bare esp-idf-svc std thread. We deliberately do
# NOT pull in Tokio — the agent only does poll-based cooperative work
# (LLM request, tool call, parse) and never spawns threads. TRACE: REQ-FW-002.
futures = { version = "0.3", default-features = false, features = ["executor"] }

# ---------------------------------------------------------------------------
# Build-time
# ---------------------------------------------------------------------------
[build-dependencies]
embuild = "0.31"
# PATCHED (MicroAgent): `cc` is used by build.rs to compile
# `src/sysenv_stubs.c` (POSIX symbol stubs for stable Rust's
# Unix PAL on ESP-IDF — see src/sysenv_stubs.c for the full
# rationale).
cc = "1"
# PATCHED (MicroAgent): `which` is used to locate the ESP-IDF
# GCC toolchain (riscv32-esp-elf-gcc) during build script execution.
which = "4.4"

# ---------------------------------------------------------------------------
# Target-gating
# ---------------------------------------------------------------------------
# When targeting Xtensa (ESP32 / ESP32-S3), override the default
# `riscv32imac` target in `.cargo/config.toml` with:
#   --target xtensa-esp32-espidf
# The esp-idf-svc build.rs detects the target automatically and sets up
# the correct toolchain (Xtensa GCC or RISC-V GCC).

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
# `wifi` — enable the Wi-Fi STA adapter (needed for LLM RPC).
# `ble`  — enable BLE (ESP32-C61 supports BLE 5 only).
# `ota`  — enable OTA partition support (controlled by sdkconfig.defaults).
[features]
# Default = USB-serial transport mode: BLE is DISABLED (the app talks to the
# C61 over UART0 / USB). Re-enable BLE with `--features ble`.
default = ["wifi", "uart", "board-c61"]
wifi = []
ble = []
ota = []
# UART0 adapter for ingress gateway. PATCHED (MicroAgent): enabled by default
# so the ingress thread registers a real UART0 driver instead of running in
# dummy mode. UART0 TX/RX are GPIO10/GPIO11 on the ESP32-C61 DevKit (the same
# pins the console uses); the ingress driver reads RX while the console writes
# TX, so they can coexist on the same UART0 hardware.
uart = []

# ---------------------------------------------------------------------------
# Board / chip selection (compile-time switch)
# ---------------------------------------------------------------------------
# Exactly ONE of these must be enabled. They gate the chip-specific code
# (BLE controller config, device name, `esp-println` chip feature, ...) so the
# same source builds for either chip. Default is the ESP32-C61 (RISC-V, 2MB
# PSRAM). To build for the ESP32-S3 (Xtensa, 8MB PSRAM), enable `board-s3` and
# build with `--target xtensa-esp32s3-espidf --features board-s3`.
board-c61 = ["esp-println/esp32c6"]   # ESP32-C61 (RISC-V, 160MHz, 2MB PSRAM)
board-s3  = ["esp-println/esp32s3"]   # ESP32-S3 (Xtensa, 240MHz, 8MB PSRAM)
# Lua application host on the S3. OFF by default: `mlua`'s vendored Lua C
# (`lua-src`) does not yet build for `xtensa-esp32s3-espidf` ("don't know how
# to build Lua for xtensa-esp32s3-espidf"), so wiring it into `board-s3` would
# break the S3 firmware build. Enable only once a Xtensa-compatible Lua engine
# is used (or `mlua`/`lua-src` adds Xtensa support). See docs/LUA_SCRIPTING_S3.md.
lua = ["dep:magent-lua"]

# ---------------------------------------------------------------------------
# esp-idf-sys metadata (consumed by `esp-idf-sys` 0.37 build.rs)
# ---------------------------------------------------------------------------
# Restrict which ESP-IDF components are built. Excluding openthread,
# esp_openthread and protocomm prevents their C headers from being
# included in the bindgen step (they reference headers like
# `esp_openthread.h` whose public/private include layout changed in
# ESP-IDF v6 and are not safe to bindgen into the Rust bindings).
# TRACE: REQ-FW-001.
[package.metadata.esp-idf-sys]
esp_idf_components = ["driver", "esp_adc", "esp_bt", "esp_http_server", "esp_event", "esp_hw_support", "esp_lcd", "esp_netif", "esp_phy", "esp_pm", "esp_rom", "esp_system", "esp_timer", "esp_wifi", "espcoredump", "esptool_py", "freertos", "hal", "heap", "log", "lwip", "mbedtls", "newlib", "nvs_flash", "nvs_secure", "port", "pthread", "riscv", "sdmmc", "soc", "spi_flash", "spiffs", "tcp_transport", "ulp", "vfs", "wear_levelling", "wifi_provisioning", "wpa_supplicant", "xtensa"]
