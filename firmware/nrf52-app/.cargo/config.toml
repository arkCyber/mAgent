# Per-crate build config for the nRF52840 firmware app.
#
# Pins the target so `cargo build`/`cargo run` from inside this crate
# always produce an ARM Cortex-M4 binary.

[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Add defmt linker script
rustflags = [
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
