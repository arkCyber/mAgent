# cargo-deny configuration for mAgent.
# TRACE: REQ-VFY-003 — Aerospace-grade policy: only allow permissive or
# strong-copyleft open-source licenses (no unknown, no GPL/AGPL).
# The CI tier-3 verifier `cargo deny check` runs this file.
[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# The advisories below are transitive through third-party crates
# (`rumqttc`, `reqwest`, `tokio`, …) that we do not control.
# Each entry has a `TRACE` link in `docs/SRS.md` and a planned upgrade.
ignore = [
    "RUSTSEC-2026-0104",   # rustls-webpki 0.102 (via rumqttc) — CRL BIT STRING panic
    "RUSTSEC-2026-0099",   # rustls-webpki 0.102 wildcard name constraint
    "RUSTSEC-2026-0049",   # rustls-webpki 0.102 CRL distribution point
    "RUSTSEC-2026-0098",   # rustls-webpki 0.102 URI name constraints
    "RUSTSEC-2026-0110",   # bare-metal deprecated (xtensa-lx-rt)
    "RUSTSEC-2026-0258",   # h2 unbounded empty DATA frames (newer ID)
    "RUSTSEC-2024-0370",   # h2 unbounded empty DATA frames (older ID)
    "RUSTSEC-2023-0089",   # paste unmaintained (proc-macro-error)
    "RUSTSEC-2024-0436",   # proc-macro-error unmaintained
    "RUSTSEC-2025-0052",   # atomic-polyfill deprecated (esp-hal 0.19)
    "RUSTSEC-2025-0134",   # async-std discontinued (host-side only)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "0BSD",
    "Unlicense",
    "NTP",
    "BSL-1.0",
    "curl",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
