# cargo-deny — Dependency Audit Configuration for MicroAgent
#
# Schema: cargo-deny 0.19.x
# Run:  cargo deny check advisories licenses bans sources

[advisories]
# In version 2 (default for 0.19.x):
#   vulnerability = "deny"   ← block any CVE-level advisory
#   unmaintained = "deny"   ← block if any dep is marked unmaintained
#
# Several embedded crates (async-std, atomic-polyfill, rustls-pemfile) are
# unmaintained but widely used in the embedded ecosystem and have no known
# vulnerabilities in their current versions. We ignore them so the build
# doesn't block, while vulnerability (CVE) advisories still block.
ignore = [
    # Embedded ecosystem crates that are unmaintained but have no known CVEs.
    # These are widely-used in the embedded Rust ecosystem; they block the
    # build only on actual vulnerability advisories (not maintenance status).
    { id = "RUSTSEC-2025-0052", reason = "async-std is discontinued; no CVE in current version" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is superseded by stable atomics; no CVE" },
    { id = "RUSTSEC-2026-0110", reason = "bare-metal crate is deprecated; superseded by core::error" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile superseded by rustls-native-certs; no CVE" },
]

[licenses]
# version 3 (default): only explicitly listed licenses allowed.
# All other licenses are denied unless added to this list.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",                   # BSD Zero Clause License (permissive)
    "CC0-1.0",               # Creative Commons Zero v1.0 (secp256k1)
    "CDLA-Permissive-2.0",    # Community Data License Agreement (webpki-roots)
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
