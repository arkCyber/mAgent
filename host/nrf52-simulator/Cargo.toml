[package]
name = "nrf52-simulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "nRF52840 Simulator for Smartwatch AI Agent Testing"

# Like `host/simulator`, this crate is intentionally independent of
# `magent-core` — it ships its own simulator stack so it can be
# built and run without the rest of the workspace. It still
# inherits workspace metadata so the version stays in lock-step.

[features]
default = []
ollama = ["dep:reqwest"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }

[dev-dependencies]